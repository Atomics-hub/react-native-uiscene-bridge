name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Boot an iPhone simulator on iOS 27
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; ds=json.load(sys.stdin)["devices"]; print(next(d["udid"] for r,l in ds.items() if "iOS-27" in r for d in l if d["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$udid" -b
      - run: npm test
  older-sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compiles to nothing with an SDK before iOS 27
        run: |
          xcodebuild -version
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          case $sdk in 2[7-9]* | [3-9][0-9]*) echo "Expected an SDK before iOS 27, found $sdk"; exit 1 ;; esac
          xcrun --sdk iphonesimulator clang -target arm64-apple-ios15.1-simulator -fobjc-arc -Wall -Werror -c ios/RNUISceneBridge.m -o bridge.o
          if nm bridge.o | grep -q RNUISceneBridge; then echo "Compiled code with the iOS $sdk SDK"; exit 1; fi
          echo "Empty with the iOS $sdk SDK"
